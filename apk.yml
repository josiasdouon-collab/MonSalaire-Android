name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev build-essential
          pip install buildozer cython==0.29.36 setuptools
      - name: Compilation
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: MON_SALAIRE_APK
          path: bin/*.apk
